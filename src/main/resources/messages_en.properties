# English replies. Keys must match messages_ru.properties exactly; Messages checks this at startup.

language.pick=Choose the language I should talk to you in.
language.set=Speaking English. /help shows what I can do.

help=Diary.\n\n\
  Send any text and it is saved as an entry for the current day. The day starts at 04:00, so \
  something written after midnight belongs to the evening that just ended.\n\n\
  /new (or close the day) - close the day: what is left of it, the feeling, whether there was a conversation. I show \
  the card for confirmation. /cancel leaves it, the day's entries stay.\n\
  /date YYYY-MM-DD <text> - an entry for a specific day\n\
  feed (or /feed, /feed N) - the whole feed: today on top, then by month\n\
  /last - show the most recent entry\n\
  /undo - delete the most recent entry\n\
  summary (or /summary) - summary of the last 7 days\n\
  /summary N - summary of the last N days\n\
  /summary all - summary of everything\n\
  /language - change the language\n\
  /remind - when to ask about the day\n\
  /who - what to call you and who the diary is about\n\
  /help - this list

