# Russian replies. Keys must match messages_en.properties exactly; Messages checks this at startup.

language.pick=Выбери язык, на котором мне с тобой говорить.
language.set=Говорю по-русски. /help — что я умею.

help=Дневник.\n\n\
  Просто пришли текст — он сохранится как запись за текущий день. День начинается в 04:00, \
  поэтому написанное после полуночи относится к только что закончившемуся вечеру.\n\n\
  /new — закрыть день: что осталось от дня, чувство дня, был ли разговор. Покажу карточку на \
  подтверждение. /cancel — выйти, записи дня останутся.\n\
  /date ГГГГ-ММ-ДД <текст> — запись за конкретный день\n\
  лента (или /feed, /feed N) — вся лента: сегодня сверху, ниже по месяцам\n\
  /last — показать последнюю запись\n\
  /undo — удалить последнюю запись\n\
  итог (или /summary) — итог за 7 дней\n\
  /summary N — сводка за N дней\n\
  /summary all — сводка за всё время\n\
  /language — сменить язык\n\
  /remind — во сколько спрашивать про день\n\
  /who — как меня звать и о ком дневник\n\
  /help — этот список

